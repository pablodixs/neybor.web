<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#00A63E" />
        <title>Sem conexão · Neybor</title>
        <style>
            @font-face {
                font-family: UISans;
                font-weight: 200 700;
                src: url('/fonts/JetBrainsSans.woff2') format('woff2');
            }
            * { box-sizing: border-box; }
            body {
                margin: 0;
                min-height: 100dvh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                font-family: UISans, system-ui, -apple-system, sans-serif;
                background: #fff;
                color: #262626;
                text-align: center;
            }
            main { max-width: 360px; }
            img { width: 72px; height: 72px; border-radius: 18px; }
            h1 { font-size: 22px; margin: 24px 0 8px; }
            p { color: #737373; line-height: 1.5; margin: 0 0 24px; }
            button {
                font: inherit;
                font-weight: 600;
                border: 0;
                border-radius: 999px;
                padding: 12px 24px;
                background: #00a63e;
                color: #fff;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/icons/icon-192.png" alt="" />
            <h1>Você está sem conexão</h1>
            <p>
                Assim que a internet voltar, o Neybor carrega os alertas e o
                feed da sua vizinhança de novo.
            </p>
            <button type="button" onclick="location.reload()">
                Tentar de novo
            </button>
        </main>
        <script>
            window.addEventListener('online', () => location.reload())
        </script>
    </body>
</html>
